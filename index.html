<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>간식 공장 - 고양이 간식 분류 게임</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Modern Clean Gothic) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Noto Sans KR', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Conveyor belt animation */
        @keyframes moveBelt {
            0% { background-position: 0 0; }
            100% { background-position: 50px 0; }
        }

        .conveyor-belt {
            background-color: #27272a;
            background-image: repeating-linear-gradient(
                90deg,
                #18181b,
                #18181b 25px,
                #3f3f46 25px,
                #3f3f46 50px
            );
            animation: moveBelt 1s linear infinite;
        }

        .conveyor-belt.paused {
            animation-play-state: paused;
        }

        /* Screen feedback overlay animations */
        @keyframes flashGreen {
            0% { background-color: rgba(34, 197, 94, 0.35); }
            100% { background-color: rgba(0, 0, 0, 0); }
        }

        @keyframes flashRed {
            0% { background-color: rgba(239, 68, 68, 0.4); }
            100% { background-color: rgba(0, 0, 0, 0); }
        }

        .flash-green {
            animation: flashGreen 0.35s ease-out;
        }

        .flash-red {
            animation: flashRed 0.35s ease-out;
        }

        /* Floating Score Feedback */
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, 0) scale(1); }
            50% { transform: translate(-50%, -30px) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -60px) scale(0.9); }
        }

        .floating-text {
            position: absolute;
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
            z-index: 50;
        }

        /* Fever Time Vivid Glow & Background Effect */
        @keyframes feverBgPulse {
            0% { background-color: #581c87; }
            50% { background-color: #7e22ce; }
            100% { background-color: #581c87; }
        }

        @keyframes feverGlow {
            0% { box-shadow: inset 0 0 25px #c084fc, 0 0 20px #e879f9; }
            50% { box-shadow: inset 0 0 45px #f0abfc, 0 0 35px #f43f5e; }
            100% { box-shadow: inset 0 0 25px #c084fc, 0 0 20px #e879f9; }
        }

        .fever-active {
            animation: feverGlow 0.8s infinite alternate !important;
            border-color: #c084fc !important;
        }

        .fever-screen {
            animation: feverBgPulse 1s infinite linear !important;
        }

        .cat-select-btn.selected, .acc-select-btn.selected {
            border-color: #000000;
            background-color: #f4f4f5;
            box-shadow: 0 0 0 2px #18181b;
        }

        /* Cat Punch Motion */
        @keyframes catPunch {
            0% { transform: translateY(0) scale(1) rotate(0deg); }
            40% { transform: translateY(-12px) scale(1.1) rotate(-8deg); }
            100% { transform: translateY(0) scale(1) rotate(0deg); }
        }

        .cat-punch {
            animation: catPunch 0.22s ease-out;
        }

        /* Enhanced Feedback Text Pop */
        @keyframes textPop {
            0% { opacity: 0; transform: translate(-50%, 20px) scale(0.6); }
            40% { opacity: 1; transform: translate(-50%, -20px) scale(1.3); }
            80% { opacity: 1; transform: translate(-50%, -35px) scale(1.1); }
            100% { opacity: 0; transform: translate(-50%, -55px) scale(0.9); }
        }

        .floating-feedback {
            position: absolute;
            animation: textPop 0.75s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body class="bg-zinc-900 min-h-screen flex items-center justify-center p-2 sm:p-4 text-zinc-900">

    <!-- Game Container (Black, Gray, White Theme) -->
    <div id="game-card" class="w-full max-w-md bg-white rounded-2xl shadow-2xl border-2 border-zinc-700 overflow-hidden flex flex-col relative transition-all duration-300">
        
        <!-- Screen Feedback Flash Overlay -->
        <div id="flash-overlay" class="absolute inset-0 pointer-events-none z-40 rounded-2xl"></div>

        <!-- Floating Feedback Text Container -->
        <div id="feedback-container" class="absolute top-1/2 left-1/2 w-full pointer-events-none z-50"></div>

        <!-- Header: Title, Stats & Lives -->
        <div class="bg-zinc-900 p-4 text-white flex flex-col gap-2 border-b border-zinc-800">
            <div class="flex justify-between items-center">
                <h1 class="text-xl font-bold tracking-tight flex items-center gap-2">
                    <i class="fa-solid fa-industry text-zinc-400"></i> 간식 공장
                </h1>
                <div id="lives-container" class="flex gap-1 text-xl">
                    <span class="paws text-zinc-100">🐾</span>
                    <span class="paws text-zinc-100">🐾</span>
                    <span class="paws text-zinc-100">🐾</span>

            </div>

            <!-- Dashboard: Score, Combo, Fever Bar -->
            <div class="flex justify-between items-end bg-zinc-800 p-3 rounded-xl border border-zinc-700 text-white">
                <div>
                    <div class="text-xs text-zinc-400 font-medium">분류한 간식</div>
                    <div id="score-display" class="text-3xl font-extrabold leading-none text-white tracking-wider">0</div>
                </div>
                
                <div class="flex items-center gap-2">
                    <button onclick="openCustomizer()" class="bg-zinc-700 hover:bg-zinc-600 text-xs text-zinc-200 px-2.5 py-1.5 rounded-lg border border-zinc-600 font-bold active:scale-95 transition-all flex items-center gap-1">
                        <span>👔</span> 꾸미기
                    </button>
                    
                    <!-- Combo & Fever Gauge -->
                    <div class="w-28 flex flex-col items-end gap-1.5">
                        <div class="flex items-center gap-1.5">
                            <span id="combo-badge" class="hidden text-xs bg-zinc-100 text-zinc-900 px-2 py-0.5 rounded font-bold">

                        <div class="w-full bg-zinc-700 h-2.5 rounded-full overflow-hidden border border-zinc-600">

                    </div>

            </div>
        </div>

        <!-- Main Game Screen (Conveyor & Cat Worker) -->
        <div id="game-screen" class="relative bg-zinc-100 flex-1 min-h-[310px] flex flex-col justify-between overflow-hidden border-b border-zinc-300 transition-colors duration-500">
            
            <!-- Top Status Banner -->
            <div class="pt-3 px-4 flex justify-between items-center text-xs font-bold text-zinc-700 z-10">
                <span id="speed-indicator" class="bg-zinc-200/90 px-2.5 py-1 rounded border border-zinc-300">

            <!-- Belt Target Line (Box Entry Zone) -->

                        <span class="text-[11px] text-zinc-900 font-bold bg-white/90 px-1.5 py-0.5 rounded border border-zinc-400">분류구역</span>
                    </div>

                            </div>

            <!-- Bottom Warning / Guide Bar -->

        </div>

        <!-- Interactive Control Buttons (1, 2, 3) -->
        <div class="bg-zinc-900 p-3 sm:p-4 grid grid-cols-3 gap-2 sm:gap-3">

                        <path d="M 17,18 L 23,18" stroke="#f97316" stroke-width="1.5" stroke-linecap="round"/>
                        <circle cx="20" cy="22" r="1.5" fill="#f97316"/>
                        <path d="M 18,10 Q 20,4 22,10 Z" fill="#fdba74"/>
                        <ellipse cx="20" cy="9" rx="3" ry="2" fill="#fed7aa"/>

                <h2 class="text-2xl font-black text-white mb-1 tracking-tight">간식 공장 라인 분류</h2>

            <!-- Current Cat Preview Card (GameOver) -->

                <div id="over-cat-preview" class="w-12 h-12 rounded-full bg-zinc-800 border border-zinc-700 overflow-hidden flex items-center justify-center p-1"></div>
                <div class="flex-1 text-left">

                    <div id="over-cat-name" class="text-xs font-bold text-white">고둥이</div>
                </div>
                <button onclick="openCustomizer()" class="bg-zinc-800 border border-zinc-700 text-zinc-200 text-xs font-bold px-3 py-2 rounded-lg hover:bg-zinc-700 active:scale-95 transition-all">
                    꾸미기 👔
                </button>
            </div>

            <button onclick="startGame()" class="w-full bg-white text-zinc-950 font-black py-3 rounded-xl hover:bg-zinc-200 active:scale-95 transition-all text-sm">
                다시 도전하기 🔄
            </button>
        </div>

        <!-- Cat Customizer Modal (Dress Room) -->
        <div id="customizer-modal" class="hidden absolute inset-0 bg-zinc-950/95 backdrop-blur-md z-50 flex flex-col justify-between p-5 text-white">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
                <h3 class="font-extrabold text-base flex items-center gap-2">
                    <span>👔</span> 고양이 드레스룸
                </h3>
                <button onclick="closeCustomizer()" class="text-zinc-400 hover:text-white text-lg px-2">✕</button>
            </div>

            <!-- Live Combined Preview -->
            <div class="flex flex-col items-center my-3">
                <div class="w-24 h-24 rounded-full bg-zinc-800 border-2 border-zinc-700 flex items-center justify-center p-1 shadow-inner relative">
                    <div id="custom-live-preview" class="w-full h-full"></div>
                </div>
                <div id="custom-cat-title" class="text-xs font-bold text-zinc-300 mt-2">고둥이</div>
            </div>

            <!-- Customizer Tab Options -->
            <div class="flex-1 overflow-y-auto space-y-3 pr-1">
                <div>
                    <label class="text-xs font-bold text-zinc-400 block mb-1.5">1. 알바냥 선택</label>
                    <div id="cat-options-grid" class="grid grid-cols-4 gap-2"></div>
                </div>
                <div>
                    <label class="text-xs font-bold text-zinc-400 block mb-1.5">2. 악세서리 선택</label>
                    <div id="acc-options-grid" class="grid grid-cols-5 gap-1.5"></div>
                </div>
            </div>

            <button onclick="closeCustomizer()" class="w-full bg-white text-zinc-950 font-black py-2.5 rounded-xl hover:bg-zinc-200 active:scale-95 transition-all text-xs mt-2">
                착용 완료 🐾
            </button>
        </div>
    </div>
